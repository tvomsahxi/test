<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>マインドマップ</title>
<style>
  :root {
    --bg: #f6f7fb;
    --panel: #ffffff;
    --text: #1f2430;
    --sub: #6b7280;
    --accent: #5b7cfa;
    --accent-dark: #4361d8;
    --root-node: #5b7cfa;
    --node: #ffffff;
    --node-border: #c9d2ea;
    --line: #aab6d8;
    --danger: #e05a5a;
    --shadow: 0 2px 8px rgba(30, 40, 80, 0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  button { font-family: inherit; }

  /* ===== ホーム画面 ===== */
  #home {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 24px 20px;
    max-width: 560px;
    margin: 0 auto;
  }
  #home h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  #home .sub {
    color: var(--sub);
    font-size: 13px;
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .new-map {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .new-map input {
    flex: 1;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid var(--node-border);
    border-radius: 10px;
    background: var(--panel);
    outline: none;
  }
  .new-map input:focus { border-color: var(--accent); }
  .new-map button {
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .new-map button:active { background: var(--accent-dark); }
  #map-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 24px;
  }
  .map-card {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 14px 16px;
    cursor: pointer;
  }
  .map-card .info { flex: 1; min-width: 0; }
  .map-card .title {
    font-size: 16px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .map-card .meta {
    font-size: 12px;
    color: var(--sub);
    margin-top: 2px;
  }
  .map-card .del {
    border: none;
    background: none;
    color: var(--sub);
    font-size: 18px;
    padding: 8px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .map-card .del:active { color: var(--danger); }
  .empty-note {
    color: var(--sub);
    font-size: 14px;
    text-align: center;
    margin-top: 40px;
    line-height: 1.8;
  }

  /* ===== キャンバス画面 ===== */
  #editor {
    display: none;
    height: 100%;
    flex-direction: column;
  }
  #editor.active { display: flex; }
  #home.hidden { display: none; }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--panel);
    box-shadow: 0 1px 4px rgba(30,40,80,0.08);
    z-index: 10;
  }
  .toolbar .back {
    border: none;
    background: none;
    font-size: 15px;
    color: var(--accent);
    font-weight: 600;
    cursor: pointer;
    padding: 6px 8px;
  }
  .toolbar .map-title {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
  }
  .toolbar .center-btn {
    border: none;
    background: none;
    font-size: 18px;
    cursor: pointer;
    padding: 6px 8px;
  }
  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    touch-action: none;
    background:
      radial-gradient(circle, #d8ddec 1px, transparent 1px);
    background-size: 24px 24px;
  }
  #world {
    position: absolute;
    left: 0; top: 0;
    transform-origin: 0 0;
  }
  #edges {
    position: absolute;
    left: 0; top: 0;
    overflow: visible;
    pointer-events: none;
  }
  #edges path {
    stroke: var(--line);
    stroke-width: 2.5;
    fill: none;
  }
  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    background: var(--node);
    border: 2px solid var(--node-border);
    border-radius: 12px;
    padding: 10px 14px;
    width: max-content;
    max-width: 200px;
    min-width: 60px;
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
    box-shadow: var(--shadow);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .node.root {
    background: var(--root-node);
    border-color: var(--root-node);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    max-width: 240px;
  }
  .node.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(91, 124, 250, 0.25);
  }
  .hint {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(31, 36, 48, 0.78);
    color: #fff;
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 999px;
    pointer-events: none;
    white-space: nowrap;
    z-index: 5;
    transition: opacity 0.5s;
  }
  .hint.fade { opacity: 0; }

  /* ===== 入力/メニュー モーダル ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 24, 36, 0.45);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding-top: 18vh;
    z-index: 100;
  }
  .overlay.active { display: flex; }
  .dialog {
    background: var(--panel);
    border-radius: 16px;
    padding: 20px;
    width: min(90vw, 360px);
    box-shadow: 0 8px 32px rgba(20, 24, 36, 0.3);
  }
  .dialog h2 {
    font-size: 15px;
    margin-bottom: 12px;
  }
  .dialog textarea {
    width: 100%;
    min-height: 72px;
    padding: 10px 12px;
    font-size: 16px;
    font-family: inherit;
    border: 1px solid var(--node-border);
    border-radius: 10px;
    resize: none;
    outline: none;
  }
  .dialog textarea:focus { border-color: var(--accent); }
  .dialog .btns {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .dialog .btns button {
    flex: 1;
    padding: 11px 0;
    font-size: 15px;
    font-weight: 600;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }
  .btn-cancel { background: #edf0f7; color: var(--text); }
  .btn-ok { background: var(--accent); color: #fff; }
  .btn-ok:active { background: var(--accent-dark); }
  .menu-list { display: flex; flex-direction: column; gap: 8px; }
  .menu-list button {
    padding: 13px 0;
    font-size: 15px;
    font-weight: 600;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: #edf0f7;
    color: var(--text);
  }
  .menu-list button.danger { color: var(--danger); }
</style>
</head>
<body>

<!-- ホーム画面 -->
<div id="home">
  <h1>マインドマップ</h1>
  <p class="sub">起点(問題やテーマ)をタイトルにして新しいキャンバスを作成。四角をタップすると、つながる四角が増えていきます。</p>
  <div class="new-map">
    <input id="new-title" type="text" placeholder="起点を入力(例:大事な予定に遅れた)" maxlength="60">
    <button id="create-btn">作成</button>
  </div>
  <div id="map-list"></div>
</div>

<!-- キャンバス画面 -->
<div id="editor">
  <div class="toolbar">
    <button class="back" id="back-btn">← 一覧</button>
    <div class="map-title" id="editor-title"></div>
    <button class="center-btn" id="center-btn" title="中心に戻る">🎯</button>
  </div>
  <div id="canvas-wrap">
    <div id="world">
      <svg id="edges"></svg>
      <div id="nodes"></div>
    </div>
    <div class="hint" id="hint">四角をタップ → つながる四角を追加 / 長押し → 編集・削除</div>
  </div>
</div>

<!-- テキスト入力モーダル -->
<div class="overlay" id="input-overlay">
  <div class="dialog">
    <h2 id="input-heading">つながる内容を入力</h2>
    <textarea id="input-text" placeholder="思いついたことを入力…"></textarea>
    <div class="btns">
      <button class="btn-cancel" id="input-cancel">キャンセル</button>
      <button class="btn-ok" id="input-ok">追加</button>
    </div>
  </div>
</div>

<!-- 長押しメニュー -->
<div class="overlay" id="menu-overlay">
  <div class="dialog">
    <h2 id="menu-heading"></h2>
    <div class="menu-list">
      <button id="menu-edit">✏️ テキストを編集</button>
      <button id="menu-delete" class="danger">🗑 この四角を削除(枝ごと)</button>
      <button id="menu-close">閉じる</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

const STORAGE_KEY = 'mindmaps-v1';

/* ---------- データ ---------- */
function loadMaps() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveMaps(maps) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(maps));
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

let maps = loadMaps();
let current = null;   // 編集中のマップ

/* ---------- ホーム画面 ---------- */
const homeEl = document.getElementById('home');
const editorEl = document.getElementById('editor');
const listEl = document.getElementById('map-list');
const titleInput = document.getElementById('new-title');

function fmtDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function renderHome() {
  listEl.innerHTML = '';
  if (maps.length === 0) {
    const p = document.createElement('p');
    p.className = 'empty-note';
    p.textContent = 'まだマインドマップがありません。\n上の欄に起点を入力して作成してください。';
    p.style.whiteSpace = 'pre-line';
    listEl.appendChild(p);
    return;
  }
  [...maps].sort((a, b) => b.updatedAt - a.updatedAt).forEach(m => {
    const card = document.createElement('div');
    card.className = 'map-card';
    const info = document.createElement('div');
    info.className = 'info';
    const t = document.createElement('div');
    t.className = 'title';
    t.textContent = m.title;
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `${m.nodes.length}個の四角 ・ ${fmtDate(m.updatedAt)}`;
    info.append(t, meta);
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '🗑';
    del.addEventListener('click', e => {
      e.stopPropagation();
      if (confirm(`「${m.title}」を削除しますか?`)) {
        maps = maps.filter(x => x.id !== m.id);
        saveMaps(maps);
        renderHome();
      }
    });
    card.append(info, del);
    card.addEventListener('click', () => openMap(m.id));
    listEl.appendChild(card);
  });
}

function createMap(title) {
  const map = {
    id: uid(),
    title,
    nodes: [{ id: uid(), text: title, parentId: null, x: 0, y: 0 }],
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };
  maps.push(map);
  saveMaps(maps);
  return map;
}

document.getElementById('create-btn').addEventListener('click', () => {
  const title = titleInput.value.trim();
  if (!title) { titleInput.focus(); return; }
  const map = createMap(title);
  titleInput.value = '';
  openMap(map.id);
});
titleInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('create-btn').click();
});

/* ---------- キャンバス ---------- */
const wrap = document.getElementById('canvas-wrap');
const world = document.getElementById('world');
const edgesSvg = document.getElementById('edges');
const nodesEl = document.getElementById('nodes');
const hintEl = document.getElementById('hint');

let view = { x: 0, y: 0, scale: 1 };   // パン/ズーム状態

function applyView() {
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
}

function centerView() {
  view.x = wrap.clientWidth / 2;
  view.y = wrap.clientHeight / 2;
  view.scale = 1;
  applyView();
}

function openMap(id) {
  current = maps.find(m => m.id === id);
  if (!current) return;
  document.getElementById('editor-title').textContent = current.title;
  homeEl.classList.add('hidden');
  editorEl.classList.add('active');
  hintEl.classList.remove('fade');
  setTimeout(() => hintEl.classList.add('fade'), 5000);
  centerView();
  renderMap();
}

function closeMap() {
  current = null;
  editorEl.classList.remove('active');
  homeEl.classList.remove('hidden');
  renderHome();
}
document.getElementById('back-btn').addEventListener('click', closeMap);
document.getElementById('center-btn').addEventListener('click', centerView);

function persist() {
  if (!current) return;
  current.updatedAt = Date.now();
  saveMaps(maps);
}

/* ノードとエッジの描画 */
const nodeEls = new Map();

function renderMap() {
  nodesEl.innerHTML = '';
  nodeEls.clear();
  current.nodes.forEach(n => {
    const el = document.createElement('div');
    el.className = 'node' + (n.parentId === null ? ' root' : '');
    el.textContent = n.text;
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
    el.dataset.id = n.id;
    nodesEl.appendChild(el);
    nodeEls.set(n.id, el);
    attachNodeEvents(el, n);
  });
  renderEdges();
}

function renderEdges() {
  edgesSvg.innerHTML = '';
  current.nodes.forEach(n => {
    if (n.parentId === null) return;
    const p = current.nodes.find(x => x.id === n.parentId);
    if (!p) return;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const mx = (p.x + n.x) / 2;
    path.setAttribute('d', `M ${p.x} ${p.y} C ${mx} ${p.y}, ${mx} ${n.y}, ${n.x} ${n.y}`);
    edgesSvg.appendChild(path);
  });
}

/* 子ノードの自動配置:親から見て空いている方向に置く */
const NODE_DIST = 150;
function childPosition(parent) {
  const grand = parent.parentId ? current.nodes.find(x => x.id === parent.parentId) : null;
  const siblings = current.nodes.filter(x => x.parentId === parent.id);
  let baseAngle;
  if (grand) {
    baseAngle = Math.atan2(parent.y - grand.y, parent.x - grand.x);
  } else {
    baseAngle = -Math.PI / 2; // ルートは上から時計回りに
  }
  const n = siblings.length;
  const spread = grand ? Math.PI / 3 : (2 * Math.PI / 8);
  const offset = grand
    ? (n % 2 === 0 ? 1 : -1) * Math.ceil(n / 2) * spread * 0.8
    : n * spread;
  const angle = baseAngle + offset;
  return {
    x: parent.x + Math.cos(angle) * NODE_DIST,
    y: parent.y + Math.sin(angle) * NODE_DIST,
  };
}

/* ---------- 入力モーダル ---------- */
const inputOverlay = document.getElementById('input-overlay');
const inputText = document.getElementById('input-text');
const inputHeading = document.getElementById('input-heading');
const inputOk = document.getElementById('input-ok');
let inputCallback = null;

function askText({ heading, initial, okLabel }, cb) {
  inputHeading.textContent = heading;
  inputText.value = initial || '';
  inputOk.textContent = okLabel;
  inputCallback = cb;
  inputOverlay.classList.add('active');
  setTimeout(() => inputText.focus(), 50);
}
function closeInput() {
  inputOverlay.classList.remove('active');
  inputCallback = null;
}
inputOk.addEventListener('click', () => {
  const v = inputText.value.trim();
  if (!v) { inputText.focus(); return; }
  const cb = inputCallback;
  closeInput();
  cb && cb(v);
});
document.getElementById('input-cancel').addEventListener('click', closeInput);
inputOverlay.addEventListener('pointerdown', e => { if (e.target === inputOverlay) closeInput(); });

/* ---------- 長押しメニュー ---------- */
const menuOverlay = document.getElementById('menu-overlay');
const menuHeading = document.getElementById('menu-heading');
let menuTarget = null;

function openMenu(node) {
  menuTarget = node;
  menuHeading.textContent = `「${node.text.length > 20 ? node.text.slice(0, 20) + '…' : node.text}」`;
  document.getElementById('menu-delete').style.display = node.parentId === null ? 'none' : '';
  menuOverlay.classList.add('active');
}
function closeMenu() { menuOverlay.classList.remove('active'); menuTarget = null; }
document.getElementById('menu-close').addEventListener('click', closeMenu);
menuOverlay.addEventListener('pointerdown', e => { if (e.target === menuOverlay) closeMenu(); });

document.getElementById('menu-edit').addEventListener('click', () => {
  const node = menuTarget;
  closeMenu();
  askText({ heading: 'テキストを編集', initial: node.text, okLabel: '保存' }, v => {
    node.text = v;
    if (node.parentId === null) {
      current.title = v;
      document.getElementById('editor-title').textContent = v;
    }
    persist();
    renderMap();
  });
});

document.getElementById('menu-delete').addEventListener('click', () => {
  const node = menuTarget;
  closeMenu();
  const collect = (id, acc) => {
    acc.add(id);
    current.nodes.filter(x => x.parentId === id).forEach(c => collect(c.id, acc));
    return acc;
  };
  const doomed = collect(node.id, new Set());
  if (doomed.size > 1 && !confirm(`この四角と、つながる${doomed.size - 1}個の四角も削除されます。よろしいですか?`)) return;
  current.nodes = current.nodes.filter(x => !doomed.has(x.id));
  persist();
  renderMap();
});

/* ---------- ノード操作(タップ=子追加 / ドラッグ=移動 / 長押し=メニュー) ---------- */
const TAP_MOVE_LIMIT = 8;      // これ以上動いたらドラッグ扱い
const LONG_PRESS_MS = 500;

function attachNodeEvents(el, node) {
  let startX, startY, moved, longTimer, dragging;

  el.addEventListener('pointerdown', e => {
    e.stopPropagation();
    el.setPointerCapture(e.pointerId);
    startX = e.clientX;
    startY = e.clientY;
    moved = false;
    dragging = false;
    longTimer = setTimeout(() => {
      if (!moved) { longTimer = null; openMenu(node); }
    }, LONG_PRESS_MS);
  });

  el.addEventListener('pointermove', e => {
    if (startX === undefined) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!moved && Math.hypot(dx, dy) > TAP_MOVE_LIMIT) {
      moved = true;
      dragging = true;
      clearTimeout(longTimer);
    }
    if (dragging) {
      node.x += (e.clientX - startX) / view.scale;
      node.y += (e.clientY - startY) / view.scale;
      startX = e.clientX;
      startY = e.clientY;
      el.style.left = node.x + 'px';
      el.style.top = node.y + 'px';
      renderEdges();
    }
  });

  el.addEventListener('pointerup', e => {
    if (startX === undefined) return;
    clearTimeout(longTimer);
    if (dragging) {
      persist();
    } else if (longTimer !== null) {
      // 純粋なタップ → 子ノード追加
      addChild(node);
    }
    startX = undefined;
  });

  el.addEventListener('pointercancel', () => {
    clearTimeout(longTimer);
    startX = undefined;
  });
}

function addChild(parent) {
  askText({ heading: 'つながる内容を入力', okLabel: '追加' }, v => {
    const pos = childPosition(parent);
    current.nodes.push({ id: uid(), text: v, parentId: parent.id, x: pos.x, y: pos.y });
    persist();
    renderMap();
    const el = nodeEls.get(current.nodes[current.nodes.length - 1].id);
    if (el) {
      el.classList.add('selected');
      setTimeout(() => el.classList.remove('selected'), 800);
    }
  });
}

/* ---------- キャンバスのパン & ピンチズーム ---------- */
const pointers = new Map();
let pinchStart = null;

function toWrap(clientX, clientY) {
  const r = wrap.getBoundingClientRect();
  return { x: clientX - r.left, y: clientY - r.top };
}

wrap.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const c = toWrap((a.x + b.x) / 2, (a.y + b.y) / 2);
    pinchStart = {
      dist: Math.hypot(a.x - b.x, a.y - b.y),
      scale: view.scale,
      cx: c.x,
      cy: c.y,
      vx: view.x,
      vy: view.y,
    };
  }
});

wrap.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  const cur = { x: e.clientX, y: e.clientY };
  pointers.set(e.pointerId, cur);

  if (pointers.size === 1 && !pinchStart) {
    view.x += cur.x - prev.x;
    view.y += cur.y - prev.y;
    applyView();
  } else if (pointers.size === 2 && pinchStart) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const newScale = Math.min(2.5, Math.max(0.35, pinchStart.scale * dist / pinchStart.dist));
    const c = toWrap((a.x + b.x) / 2, (a.y + b.y) / 2);
    // ピンチ中心を基準に拡縮
    view.x = c.x - (pinchStart.cx - pinchStart.vx) * (newScale / pinchStart.scale);
    view.y = c.y - (pinchStart.cy - pinchStart.vy) * (newScale / pinchStart.scale);
    view.scale = newScale;
    applyView();
  }
});

function releasePointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = null;
}
wrap.addEventListener('pointerup', releasePointer);
wrap.addEventListener('pointercancel', releasePointer);

/* PC用:ホイールでズーム */
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const newScale = Math.min(2.5, Math.max(0.35, view.scale * factor));
  const r = newScale / view.scale;
  const c = toWrap(e.clientX, e.clientY);
  view.x = c.x - (c.x - view.x) * r;
  view.y = c.y - (c.y - view.y) * r;
  view.scale = newScale;
  applyView();
}, { passive: false });

/* ---------- 起動 ---------- */
renderHome();

})();
</script>
</body>
</html>
